<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Article | Shree Balaji Constructions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../CSS/style.css" rel="stylesheet" />
  </head>
  <body data-page="insights">
    <div id="navbar-slot"></div>

    <section class="page-hero" id="adHero">
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item">
              <a href="insights.html">Insights</a>
            </li>
            <li class="breadcrumb-item active" id="adCrumb">Article</li>
          </ol>
        </nav>
        <h1 class="mt-3" id="adTitle">Loading…</h1>
        <p class="text-white-50 mt-2" id="adMeta"></p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8" id="adBody">
            <div class="alert alert-warning">Loading article…</div>
          </div>
        </div>
      </div>
    </section>

    <div id="footer-slot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JS/data.js"></script>
    <script src="../JS/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const { ARTICLES } = window.BC;
        if (!ARTICLES) return;

        const slug = new URLSearchParams(location.search).get("article");
        const a = ARTICLES.find((x) => x.slug === slug) || ARTICLES[0];
        if (!a) return;

        document.title = `${a.title} | Shree Balaji Constructions`;
        const hero = document.getElementById("adHero");
        hero.style.backgroundImage = `linear-gradient(120deg,rgba(13,27,42,.9),rgba(13,27,42,.65)),url('${a.cover}')`;
        document.getElementById("adTitle").textContent = a.title;
        document.getElementById("adCrumb").textContent = a.title;
        const date = new Date(a.date).toLocaleDateString(undefined, {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
        document.getElementById("adMeta").textContent =
          `${a.category} · ${date}`;
        document.getElementById("adBody").innerHTML = `
      <img src="${a.cover}" alt="${a.title}" class="rounded-4 mb-4 w-100" loading="lazy">
      <div class="article-body">${a.body}</div>
      <hr class="my-5">
      <a href="insights.html" class="btn-link-arrow"><i class="bi bi-arrow-left"></i> Back to Insights</a>`;
      });
    </script>
  </body>
</html>
